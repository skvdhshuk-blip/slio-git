[package]
name = "src-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
app-store = ["git-core/app-store"]

[dependencies]
git-core = { path = "../src/git-core" }
git2 = { workspace = true }
iced = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread"] }
rfd = { workspace = true }
anyhow = { workspace = true }
notify = { workspace = true }
dirs = "6"
num_cpus = "1"
chrono = { workspace = true }
once_cell = "1.19"
syntect = { workspace = true }
iced-code-editor = { path = "../vendor/iced-code-editor" }
unicode-width = "0.2"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sys-locale = "0.3"

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
open = "5"
