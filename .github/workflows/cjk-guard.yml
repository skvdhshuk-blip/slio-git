name: CJK Guard

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  cjk-guard:
    name: No raw CJK outside i18n
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Compile and lint each distribution in build.yml; this job owns i18n/ops.
      - name: No raw CJK string literals outside i18n.rs
        run: python3 scripts/check-ui-i18n.py
      - name: Guard contract tests
        run: python3 -m unittest discover -s scripts/tests
      - name: N3 ops tests (yx.sh fence + verify-config)
        run: bash .autonomous-team/tests/n3/run.sh
